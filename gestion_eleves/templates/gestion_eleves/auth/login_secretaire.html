<!DOCTYPE html>
{% load static %}
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UCCB — Secrétariat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.1);padding:40px;width:100%;max-width:400px;}
.logo-wrap{text-align:center;margin-bottom:24px;}
.logo-wrap img{height:48px;width:auto;}
.role-pill{display:block;width:fit-content;margin:0 auto 16px;background:#fff8e8;border:1px solid #c8972a;color:#c8972a;padding:4px 12px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;}
h2{font-size:20px;font-weight:700;color:#1e2d40;text-align:center;margin-bottom:6px;}
.sub{font-size:13px;color:#6b7280;text-align:center;margin-bottom:28px;}
.field{margin-bottom:16px;}
label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;}
input{width:100%;padding:10px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;transition:border-color .2s;}
input:focus{outline:none;border-color:#1e2d40;}
.btn{width:100%;padding:12px;background:#1e2d40;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;font-family:'Inter',sans-serif;}
.btn:hover{background:#162032;}
.link-row{text-align:center;margin-top:16px;font-size:13px;color:#6b7280;}
.link-row a{color:#1e2d40;font-weight:600;text-decoration:none;}
.alert{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;}
.back{text-align:center;margin-top:20px;}
.back a{font-size:12px;color:#9ca3af;text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <img src="{% static 'gestion_eleves/img/logo_uccb.jpg' %}" alt="UCCB">
  </div>
  <div class="role-pill"> Secrétariat Universitaire</div>
  <h2>Connexion</h2>
  <p class="sub">Accès réservé au personnel administratif</p>
  {% for msg in messages %}
  <div class="alert">{{ msg }}</div>
  {% endfor %}
  <form method="POST" autocomplete="off">
    {% csrf_token %}
    <div class="field">
      <label>Nom d'utilisateur</label>
      <input type="text" name="username" placeholder="votre identifiant" required autofocus>
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" name="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn">Se connecter</button>
  </form>
  <div class="link-row">
    <a href="{% url 'reset_mdp_secretaire' %}">Mot de passe oublié ?</a>
  </div>
  <!--<div class="link-row" style="margin-top:8px;">
    Vous êtes de la Faculté ? <a href="{% url 'login_faculte' %}">Connexion Faculté →</a>
  </div>-->
  <div class="back">
    <a href="{% url 'portail_accueil' %}">← Retour au portail</a>
  </div>
</div>
</body>
</html>
